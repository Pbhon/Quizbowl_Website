name: Project checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm test:deployment
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:accounts
      - run: pnpm test:practice
      - run: pnpm test:statistics
      - run: pnpm test:team
      - run: pnpm test:assignments
      - run: pnpm test:calendar
      - run: pnpm test:anki
      - run: node --test tests/deck-permissions.test.mjs
      - run: pnpm test:history
      - run: pnpm test:backend
      - run: pnpm build
      - run: pnpm test:rules
      - run: pnpm test:backend:emulator
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec firebase emulators:exec --project demo-quizbowl --only auth,firestore "pnpm test:e2e"
        env:
          E2E_FIREBASE: 'true'
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
